apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-usage-calculator
  namespace: gpu-sizing
  labels:
    app.kubernetes.io/name: gpu-usage-calculator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gpu-usage-calculator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gpu-usage-calculator
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: calculator
          image: quay.io/example/gpu-usage-calculator:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      terminationGracePeriodSeconds: 15
